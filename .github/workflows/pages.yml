name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < CNAME)" = "wm.arkflame.com"
          test -f index.html
          test -f assets/css/site.css
          test -f assets/js/site.js
          test -f assets/images/flamewm-desktop.webp

          rm -rf _site
          mkdir -p _site
          cp index.html 404.html CNAME robots.txt sitemap.xml site.webmanifest .nojekyll _site/
          cp -R assets _site/assets

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

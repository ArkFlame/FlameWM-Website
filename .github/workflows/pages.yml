name: Deploy FlameWM website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flamewm-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate checked-in static website
        run: python3 tests/check_static.py .
      - name: Create isolated Pages artifact
        run: python3 scripts/site_release.py stage
      - name: Validate exact deployment artifact
        run: python3 tests/check_static.py .pages-output
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
